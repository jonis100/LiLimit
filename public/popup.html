<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LiLimit — Time Limit Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <img src="images/lily.png" alt="LiLimit logo" class="logo" />
        <h1 class="title">LiLimit</h1>
        <button id="settingsBtn" class="theme-toggle" aria-label="Settings">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </header>

      <nav class="tabs">
        <button class="tab-btn active" data-tab="set-limits">Set Limits</button>
        <button class="tab-btn" data-tab="stats">Live Stats</button>
        <button class="tab-btn" data-tab="all-limits">All Limits</button>
      </nav>

      <div id="set-limits" class="tab-content active">
        <form id="limitsForm" class="form" autocomplete="off">
          <div class="form-header">
            <label for="hostname" class="label">Website (URL or hostname)</label>
            <button
              type="button"
              id="useCurrentTab"
              class="current-tab-btn"
              title="Use current tab URL"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"
                />
              </svg>
              <span>Current Tab</span>
            </button>
          </div>
          <input
            type="text"
            id="hostname"
            name="hostname"
            class="input"
            placeholder="e.g. https://www.example.com or example.com"
            aria-label="Website URL or hostname"
          />

          <div class="two-col">
            <div>
              <label for="timeLimit" class="label">Time limit (minutes)</label>
              <input
                type="number"
                id="timeLimit"
                name="timeLimit"
                class="input"
                min="1"
                placeholder="No time limit yet"
              />
            </div>
            <div>
              <label for="visitLimit" class="label">Visit limit (per day)</label>
              <input
                type="number"
                id="visitLimit"
                name="visitLimit"
                class="input"
                min="1"
                placeholder="No visit limit yet"
              />
            </div>
          </div>

          <div class="buttons">
            <button type="submit" id="submitButton" class="btn primary">Set limit</button>
            <button type="button" id="DeleteLimits" class="btn danger">Delete limit</button>
          </div>
        </form>
      </div>

      <!-- Live Stats Tab -->
      <div id="stats" class="tab-content">
        <div class="stats-container">
          <div class="stats-header">
            <h3 class="stats-title">Today's Activity</h3>
            <div class="stats-actions">
              <button
                id="exportStats"
                class="icon-btn"
                aria-label="Export stats"
                title="Export stats as JSON"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                  <polyline points="7 10 12 15 17 10" />
                  <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
              </button>
              <button id="refreshStats" class="icon-btn" aria-label="Refresh stats">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path
                    d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div id="statsContent" class="stats-content">
            <div class="empty-state">
              <svg
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <path
                  d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0v-5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"
                />
              </svg>
              <p>No activity yet today</p>
            </div>
          </div>
        </div>
      </div>

      <!-- All Limits Tab -->
      <div id="all-limits" class="tab-content">
        <div class="limits-container">
          <div class="limits-header">
            <input
              type="text"
              id="searchLimits"
              class="search-input"
              placeholder="Search websites..."
              aria-label="Search limits"
            />
          </div>
          <div id="limitsContent" class="limits-content">
            <div class="empty-state">
              <svg
                width="48"
                height="48"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
              </svg>
              <p>No limits set yet</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="settings" class="tab-content">
        <div class="settings-container">
          <h3 class="settings-title">Settings</h3>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-label">Dark mode</span>
              <span class="setting-desc">Toggle between dark and light theme</span>
            </div>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
              <svg
                class="sun-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
              </svg>
              <svg
                class="moon-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
              </svg>
            </button>
          </div>
          <div class="setting-row">
            <div class="setting-info">
              <span class="setting-label">Count tab switch as new visit</span>
              <span class="setting-desc">When off, only navigating to a URL counts as a visit</span>
            </div>
            <label class="toggle">
              <input type="checkbox" id="countSwitchAsVisit" />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <section id="message" class="message" aria-live="polite" hidden></section>

      <footer class="footer">
        <div class="footer-content">
          <div class="footer-tip">Tip: you can enter either a full URL or just the hostname.</div>
          <button id="nextTipBtn" class="next-tip-btn" aria-label="Next tip" title="Next tip">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <polyline points="9 18 15 12 9 6" />
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="popup/popup.js"></script>
  </body>
</html>
