name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate coverage report
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false
          verbose: true
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Verify build artifacts
        run: |
          echo "Checking required files in dist/..."
          test -f dist/manifest.json || (echo "manifest.json missing" && exit 1)
          test -f dist/popup.html || (echo "popup.html missing" && exit 1)
          test -f dist/popup.css || (echo "popup.css missing" && exit 1)
          test -d dist/pages || (echo "pages directory missing" && exit 1)
          test -d dist/images || (echo "images directory missing" && exit 1)
          test -f dist/background/background.js || (echo "background.js missing" && exit 1)
          test -f dist/popup/popup.js || (echo "popup.js missing" && exit 1)
          test -f dist/shared/utils.js || (echo "utils.js missing" && exit 1)
          echo "✓ All required build artifacts present"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: extension-build
          path: dist/
          retention-days: 7
